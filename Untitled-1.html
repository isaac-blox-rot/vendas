<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaac Blox & Rot - Loja Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b12;
            --card-bg: rgba(20, 20, 33, 0.85);
            --card-border: #252538;
            --accent-green: #00ff66;
            --accent-pink: #ff007f;
            --accent-blue: #00d9ff;
            --accent-purple: #9d4edd;
            --text-color: #ffffff;
            --text-dim: #a0a0b8;
            --danger: #ff3366;
            --warning: #ffaa00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(11, 11, 18, 0.85), rgba(11, 11, 18, 0.85)),
                url('fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(24, 21, 40, 0.9) 0%, rgba(11, 11, 18, 0.9) 100%);
            border-bottom: 2px solid var(--accent-pink);
            margin-bottom: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink), var(--accent-green));
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-blue) 70%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        header p {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-blue);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-purple);
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.25);
        }

        .product-category {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .product-price-tag {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-green);
        }

        .stock-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
            width: fit-content;
        }

        .in-stock {
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 102, 0.3);
        }

        .low-stock {
            background: rgba(255, 170, 0, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .out-stock {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .btn-buy {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-pink) 0%, #b30059 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
            text-transform: uppercase;
        }

        .btn-buy:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-buy:disabled {
            background: #2a2a38;
            color: #666;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #141421;
            border: 1px solid var(--accent-green);
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-icon {
            font-size: 3rem;
            color: var(--accent-green);
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .btn-close-modal {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>ISAAC BLOX & ROT</h1>
        <p><i class="fa-solid fa-bolt"></i> DIGITAL GAMING ROBLOX ACCOUNTS E BRAINROTS PELOS MENORES PREÇOS <i class="fa-solid fa-bolt"></i></p>
    </header>

    <div class="container">
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-store"></i> Vitrine de Produtos
            </div>
            <span id="productCount" style="color: var(--text-dim); font-size: 0.85rem;">Carregando...</span>
        </div>
        
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-card">
            <i class="fa-solid fa-circle-check modal-icon"></i>
            <div class="modal-title">Pedido Realizado!</div>
            <div class="modal-desc" id="modalText">Sua conta/item digital foi reservado com sucesso.</div>
            <button class="btn-close-modal" onclick="closeModal()">Continuar Comprando</button>
        </div>
    </div>

    <script>
        // Carrega os produtos salvos pelo seu painel de admin
        function getProducts() {
            const saved = localStorage.getItem('isaac_products');
            if (saved) return JSON.parse(saved);
            return [
                { id: 1, name: "Conta Roblox (Kitsune + V4)", category: "Roblox Account", price: 45.00, stock: 4 },
                { id: 2, name: "Brainrot Skibidi Rizz God", category: "Brainrot Item", price: 15.00, stock: 12 },
                { id: 3, name: "Conta Stacked Blox Fruits", category: "Roblox Account", price: 120.00, stock: 1 }
            ];
        }

        function render() {
            const products = getProducts();
            const grid = document.getElementById('productsGrid');
            const productCount = document.getElementById('productCount');
            
            grid.innerHTML = '';
            productCount.innerText = `${products.length} itens disponíveis`;

            products.forEach(p => {
                let stockClass = 'in-stock';
                let stockText = `<i class="fa-solid fa-check"></i> Em Estoque (${p.stock})`;
                
                if (p.stock === 0) {
                    stockClass = 'out-stock';
                    stockText = `<i class="fa-solid fa-xmark"></i> Esgotado`;
                } else if (p.stock <= 2) {
                    stockClass = 'low-stock';
                    stockText = `<i class="fa-solid fa-triangle-exclamation"></i> Restam apenas ${p.stock}`;
                }

                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <div class="product-category">${p.category}</div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price-tag">
                                <span style="font-size: 0.9rem; color: var(--accent-green); font-weight: bold;">R$</span>
                                <span class="product-price">${p.price.toFixed(2)}</span>
                            </div>
                            <span class="stock-badge ${stockClass}">
                                ${stockText}
                            </span>
                        </div>
                        <button class="btn-buy" ${p.stock === 0 ? 'disabled' : ''} onclick="buyProduct(${p.id})">
                            <i class="fa-solid fa-cart-shopping"></i> ${p.stock > 0 ? 'Comprar Agora' : 'Esgotado'}
                        </button>
                    </div>
                `;
            });
        }

        function buyProduct(id) {
            let products = getProducts();
            const product = products.find(p => p.id === id);
            if (product && product.stock > 0) {
                product.stock -= 1;
                localStorage.setItem('isaac_products', JSON.stringify(products));
                render();
                
                document.getElementById('modalText').innerText = `Você escolheu "${product.name}" por R$ ${product.price.toFixed(2)}.`;
                document.getElementById('purchaseModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
        }

        render();
    </script>
</body>
</html>
